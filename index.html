<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#fff9f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#21171d"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://datehaja.com/" />

    <title>Datehaja — What do you want to do?</title>
    <meta
      name="description"
      content="Start with the date you actually want — a film, a walk, a gallery, or anything else. Datehaja finds a compatible new person who wants to join you and turns the idea into one real plan."
    />

    <meta property="og:url" content="https://datehaja.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Datehaja" />
    <meta property="og:title" content="Datehaja — What do you want to do?" />
    <meta
      property="og:description"
      content="Tell us what you want to do. Datehaja finds a compatible new person who wants to do it too."
    />
    <meta property="og:image" content="https://datehaja.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Datehaja — What do you want to do?" />
    <meta
      name="twitter:description"
      content="Start with the date you want. We'll find the person to share it with."
    />
    <meta name="twitter:image" content="https://datehaja.com/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Gowun+Batang:wght@400;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&family=Shippori+Mincho:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var l =
            localStorage.getItem("datehaja-locale") ||
            localStorage.getItem("datedrop-locale");
          if (l) document.documentElement.setAttribute("lang", l);
          var t =
            localStorage.getItem("datehaja-theme") ||
            localStorage.getItem("datedrop-theme");
          if (!t || t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
