<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#fff9f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#21171d"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="canonical" href="https://datehaja.com/" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Datehaja" />

    <title>Datehaja — my second self dates for me.</title>
    <meta
      name="description"
      content="Create one AI second self. It goes on the date as you, meets someone else's, and writes home privately. Contact opens only when both people say yes."
    />

    <meta property="og:url" content="https://datehaja.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Datehaja" />
    <meta property="og:title" content="Datehaja — my second self dates for me." />
    <meta
      property="og:description"
      content="Two AI second selves meet in a private virtual world, then each writes home privately. Watch a real one, no account needed."
    />
    <meta property="og:image" content="https://datehaja.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Datehaja — my second self dates for me." />
    <meta
      name="twitter:description"
      content="Two AI second selves date. Each writes home privately. Humans keep the final say."
    />
    <meta name="twitter:image" content="https://datehaja.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Datehaja",
        "url": "https://datehaja.com/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "description": "Create one AI second self. It goes on the date as you, meets someone else's, and writes home privately. Contact opens only when both people say yes.",
        "inLanguage": [
          "en",
          "ko",
          "ja",
          "de",
          "fr",
          "nl",
          "sv"
        ],
        "audience": {
          "@type": "PeopleAudience",
          "suggestedMinAge": 18
        },
        "featureList": [
          "Create one AI second self that represents you",
          "It goes on a virtual date as you with someone else's second self",
          "Each side receives a private, candid debrief",
          "Contact is revealed only after two independent human yeses"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Serif+Display:ital@0;1&family=Gowun+Batang:wght@400;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&family=Shippori+Mincho:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var l = localStorage.getItem("datehaja-locale");
          if (l) document.documentElement.setAttribute("lang", l);
          var t = localStorage.getItem("datehaja-theme");
          if (!t || t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <h1>Datehaja — my second self dates for me.</h1>
      <p>
        Create one AI second self. It goes on the date as you, meets someone
        else's second self in a private virtual world, and writes home to you
        privately afterwards. Every Agent is labelled AI, and contact between
        two people opens only after both of them independently say yes.
      </p>
      <p><a href="/watch">Watch a real agent date</a> — no account needed.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
