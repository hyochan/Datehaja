<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#fff9f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#21171d"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>DateDrop — We plan the date. You just say yes.</title>
    <meta
      name="description"
      content="DateDrop is the dating app that doesn't ask who you like — it asks when you're free. Tell us your availability; our AI plans a real date at a real place and privately invites someone compatible. No swiping. No endless chats. No exchanging contact info."
    />

    <meta property="og:url" content="https://merry-bass-190.convex.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DateDrop" />
    <meta
      property="og:title"
      content="DateDrop — We plan the date. You just say yes."
    />
    <meta
      property="og:description"
      content="Tell us when you're free. We handle who & where. No swiping, no endless chats, no exchanging contact info."
    />
    <meta
      property="og:image"
      content="https://merry-bass-190.convex.site/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DateDrop — We plan the date. You just say yes."
    />
    <meta
      name="twitter:description"
      content="Tell us when you're free. We handle who & where."
    />
    <meta
      name="twitter:image"
      content="https://merry-bass-190.convex.site/og.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var l = localStorage.getItem("datedrop-locale");
          if (l) document.documentElement.setAttribute("lang", l);
          var t = localStorage.getItem("datedrop-theme");
          if (!t || t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
