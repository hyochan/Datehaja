name: Verify + Deploy

# Verify every push and pull request; deploy only from main.
#
# The frontend has two hosts. Vercel rebuilds datehaja.com on its own whenever
# main moves, but the convex.site origin — the URL the hackathon rules require
# a submission to be openable at — is published by a separate command. Nothing
# announced the difference, so the submitted URL served a build that was days
# stale while every check passed. This workflow removes the manual step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          # Registry metadata is occasionally incomplete even when the frozen
          # lockfile is valid, so a single failure is not a real failure.
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        # The end-to-end suites are deliberately not here: they create real
        # accounts, read a real inbox and spend model calls. They are run by
        # hand against the development deployment.
        run: bun run test

      - name: Build
        run: bun run build

  deploy:
    name: Deploy backend + convex.site
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      # Never let two deploys of the same branch interleave; a half-published
      # manifest would serve a mix of two builds.
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret not set. Create a production deploy key in the Convex dashboard and add it to the repository secrets."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done

      - name: Deploy Convex functions and publish convex.site
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        # One command, in this order: build the frontend against the production
        # Convex URL the deploy key resolves to, push the backend, then upload
        # the static files. Doing it together is what keeps the window where
        # the two disagree as short as it can be.
        run: bunx static-hosting deploy --build-command "bun run build"

      - name: Verify the submitted URL serves this commit
        env:
          SITE: https://merry-bass-190.convex.site
        # A deploy that reports success but leaves the old bundle in place is
        # the exact failure this workflow exists to prevent, so it is checked
        # rather than assumed.
        run: |
          set -euo pipefail
          local_bundle=$(cd dist && ls assets/index-*.js | head -1)
          echo "Built $local_bundle"
          # Publishing is not instantaneous, so give it a few seconds before
          # calling a mismatch a failure.
          for attempt in 1 2 3 4 5; do
            served=$(curl -fsSL "$SITE/" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$served" = "$local_bundle" ]; then
              echo "$SITE is serving this build."
              exit 0
            fi
            echo "Attempt $attempt: serving '${served:-none}', waiting for '$local_bundle'."
            sleep 5
          done
          echo "::error::$SITE is still serving '${served:-none}' rather than '$local_bundle'."
          exit 1
